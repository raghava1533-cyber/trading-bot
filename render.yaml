 render.yaml  -  Render Blueprint  (100% FREE)
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO DEPLOY:
#   1. render.com → New → Blueprint → connect repo raghava1533-cyber/trading-bot
#   2. Render reads this file and creates both services automatically
#   3. Set UPSTOX_API_KEY and UPSTOX_API_SECRET as secrets in dashboard
#   4. Set UPSTOX_REDIRECT_URI = https://trading-bot-api.onrender.com/auth/callback
#      in your Upstox Developer Portal app settings
#   5. Deploy Vercel frontend, then update FRONTEND_URL here
#
# DAILY TOKEN REFRESH (10 seconds):
#   Open https://trading-bot-api.onrender.com/auth in browser
#   Click "Login with Upstox" → token saves automatically to Redis
#   No Render dashboard, no env var changes, no redeploy needed
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: trading-bot-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      # ── Upstox credentials — SET THESE AS SECRETS in Render dashboard ───────
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false
      # UPSTOX_ACCESS_TOKEN is NOT needed here — managed via /auth page + Redis

      # ── Render auto-sets this — used to build /auth/callback URL ────────────
      - key: RENDER_EXTERNAL_URL
        value: https://trading-bot-api.onrender.com   # Render sets this automatically

      # ── Redis — auto-injected from the Redis service below ──────────────────
      - key: REDIS_URL
        fromService:
          name: trading-bot-redis
          type: redis
          property: connectionString

      # ── CORS — update to your Vercel URL after frontend deploy ──────────────
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

      # ── Bot settings ─────────────────────────────────────────────────────────
      - key: BOT_ENABLED
        value: "true"
      - key: DRY_RUN
        value: "true"
      - key: ACTIVE_INDICES
        value: "NIFTY"
      - key: STOP_LOSS
        value: "-1500"
      - key: TARGET_PROFIT
        value: "1000"
      - key: TARGET_DELTA
        value: "0.30"
      - key: SPREAD_WIDTH_POINTS
        value: "200"
      - key: MIN_CREDIT_RATIO
        value: "0.25"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: MAX_TRADES_PER_DAY
        value: "3"
      - key: TRADE_COOLDOWN_SECONDS
        value: "900"
      - key: CARRY_WIN_RATE_THRESHOLD
        value: "0.55"

  - type: redis
    name: trading-bot-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
