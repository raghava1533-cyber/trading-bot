# render.yaml  -  Render Blueprint
# Connect this repo in Render dashboard -> New -> Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: trading-bot-api
    runtime: python
    region: singapore
    plan: starter              # $7/mo - always-on (free tier sleeps)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # ── Upstox (set values in Render dashboard, NOT here) ──────────────────
      - key: UPSTOX_ACCESS_TOKEN
        sync: false            # SECRET - fill in Render dashboard
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false

      # ── Redis (auto-injected from addon below) ─────────────────────────────
      - key: REDIS_URL
        fromService:
          name: trading-bot-redis
          type: redis
          property: connectionString

      # ── Frontend CORS (update after Vercel deploy) ─────────────────────────
      - key: FRONTEND_URL
        value: https://your-app.vercel.app   # <- replace with your Vercel URL

      # ── Bot settings ───────────────────────────────────────────────────────
      - key: BOT_ENABLED
        value: "true"
      - key: DRY_RUN
        value: "true"          # set false for live trading
      - key: ACTIVE_INDICES
        value: "NIFTY"
      - key: STOP_LOSS
        value: "-1500"
      - key: TARGET_PROFIT
        value: "1000"
      - key: TARGET_DELTA
        value: "0.30"
      - key: SPREAD_WIDTH_POINTS
        value: "200"
      - key: MIN_CREDIT_RATIO
        value: "0.25"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: MAX_TRADES_PER_DAY
        value: "3"
      - key: TRADE_COOLDOWN_SECONDS
        value: "900"
      - key: CARRY_WIN_RATE_THRESHOLD
        value: "0.55"

      # ── Python path ────────────────────────────────────────────────────────
      - key: PYTHONPATH
        value: ./core

  - type: redis
    name: trading-bot-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
