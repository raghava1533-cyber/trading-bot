# render.yaml  -  Render Blueprint  (100% FREE)
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO DEPLOY:
#   1. render.com → New → Blueprint → connect repo raghava1533-cyber/trading-bot
#   2. Render reads this file and creates both services automatically
#   3. Set UPSTOX_ACCESS_TOKEN, UPSTOX_API_KEY, UPSTOX_API_SECRET in dashboard
#   4. Deploy Vercel frontend, then set FRONTEND_URL here
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── FastAPI Web Service (API + Bot background task) ─────────────────────────
  - type: web
    name: trading-bot-api
    runtime: python
    region: singapore
    plan: free

    # Build: install all Python dependencies
    buildCommand: pip install -r requirements.txt

    # Start: run from repo root — api/server.py self-adds core/ to sys.path
    # DO NOT change this — it is correct as-is
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      # ── Upstox credentials — ADD THESE AS SECRETS in Render dashboard ───────
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_API_KEY
        sync: false
      - key: UPSTOX_API_SECRET
        sync: false

      # ── Redis — auto-injected from the Redis service below ──────────────────
      - key: REDIS_URL
        fromService:
          name: trading-bot-redis
          type: redis
          property: connectionString

      # ── CORS — update to your Vercel URL after frontend deploy ──────────────
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

      # ── Bot settings ─────────────────────────────────────────────────────────
      - key: BOT_ENABLED
        value: "true"
      - key: DRY_RUN
        value: "true"
      - key: ACTIVE_INDICES
        value: "NIFTY"
      - key: STOP_LOSS
        value: "-1500"
      - key: TARGET_PROFIT
        value: "1000"
      - key: TARGET_DELTA
        value: "0.30"
      - key: SPREAD_WIDTH_POINTS
        value: "200"
      - key: MIN_CREDIT_RATIO
        value: "0.25"
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: MAX_TRADES_PER_DAY
        value: "3"
      - key: TRADE_COOLDOWN_SECONDS
        value: "900"
      - key: CARRY_WIN_RATE_THRESHOLD
        value: "0.55"

  # ── Redis (FREE — 25 MB) ─────────────────────────────────────────────────────
  - type: redis
    name: trading-bot-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
